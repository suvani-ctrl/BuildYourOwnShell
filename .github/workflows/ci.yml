name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -Ddir=/tmp/codecrafters-build-shell-java

      - name: Smoke test — invalid command
        run: |
          printf 'bad_cmd\nexit\n' | \
            java --enable-native-access=ALL-UNNAMED \
              -jar /tmp/codecrafters-build-shell-java/codecrafters-shell.jar \
            | grep -q "bad_cmd: command not found"

      - name: Smoke test — echo
        run: |
          printf 'echo hello\nexit\n' | \
            java --enable-native-access=ALL-UNNAMED \
              -jar /tmp/codecrafters-build-shell-java/codecrafters-shell.jar \
            | grep -q "hello"
